<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: vfimg:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionForge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles/app.css" />
</head>

<body>
  <main class="screen">
    <header class="app-chrome-header" id="app-chrome-header">
      <div class="app-chrome-header__brand sidebar-brand">
        <div class="logo-wrap" aria-hidden="true">
          <img class="brand-logo" src="images/logo/VisionForge.png" alt="" width="22" height="22" />
        </div>
        <span class="sidebar-brand__title">VisionForge</span>
      </div>
      <div class="app-chrome-header__topbar app-topbar" id="app-topbar">
        <div class="app-topbar__left">
          <nav class="app-menubar" aria-label="Application">
            <div class="app-menubar__menu" id="file-menu">
              <button type="button" class="app-menubar__item" id="btn-file-menu" aria-haspopup="true" aria-expanded="false" aria-controls="file-menu-dropdown">File</button>
              <div class="app-menubar__dropdown" id="file-menu-dropdown" hidden role="menu">
                <button type="button" class="app-menubar__dropdown-item" id="btn-select-image-folder" role="menuitem" disabled>Select Image Folder</button>
              </div>
            </div>
            <button type="button" class="app-menubar__item">Edit</button>
            <button type="button" class="app-menubar__item">Help</button>
          </nav>
          <span class="app-breadcrumb__current" id="app-breadcrumb">Welcome</span>
        </div>
        <div class="app-topbar__right">
          <button type="button" id="btn-new-release" class="btn-new-release" hidden aria-label="New Release Available" title="New Release Available">
            New Release Available
          </button>
          <button type="button" class="window-control-btn" id="btn-settings" aria-label="Settings" title="Settings">
            <i class="fa-regular fa-gear" aria-hidden="true"></i>
          </button>
          <div class="window-controls">
            <button type="button" class="window-control-btn" id="window-minimize-btn" aria-label="Minimize">
              <i class="fa-regular fa-window-minimize"></i>
            </button>
            <button type="button" class="window-control-btn" id="window-maximize-btn" aria-label="Maximize">
              <i class="fa-regular fa-window-maximize"></i>
            </button>
            <button type="button" class="window-control-btn window-control-btn--close" id="window-close-btn" aria-label="Close">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="screen-body" id="screen-body">
      <aside class="tools-rail" id="tools-rail" aria-label="Tools">
        <button type="button" class="tool-btn is-selected" id="tool-cursor" data-tool="cursor" aria-label="Mouse Cursor" title="Mouse Cursor" aria-pressed="true">
          <i class="fa-solid fa-arrow-pointer" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" id="tool-move" data-tool="move" aria-label="Move" title="Move" aria-pressed="false">
          <i class="fa-solid fa-hand" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn tool-btn--command" id="tool-zoom-in" data-tool="zoom-in" aria-label="Zoom In" title="Zoom In">
          <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn tool-btn--command" id="tool-zoom-out" data-tool="zoom-out" aria-label="Zoom Out" title="Zoom Out">
          <i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn tool-btn--command" id="tool-rotate" data-tool="rotate" aria-label="Rotate" title="Rotate">
          <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" id="tool-box" data-tool="box" aria-label="Box" title="Box" aria-pressed="false">
          <i class="fa-solid fa-vector-square" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" id="tool-hexagon" data-tool="hexagon" aria-label="Hexagon" title="Hexagon" aria-pressed="false">
          <svg class="tool-btn__hexagon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <polygon points="12,2 21,7.5 21,16.5 12,22 3,16.5 3,7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="tools-rail__divider" id="tools-rail-divider" hidden aria-hidden="true"></div>
        <button type="button" class="tool-btn tool-btn--command" id="tool-select-images" data-tool="select-images" aria-label="Select Images" title="Select Images" hidden>
          <i class="fa-solid fa-images" aria-hidden="true"></i>
        </button>
      </aside>

      <section class="screen-section screen-section--main">
        <div class="start-page" id="start-page">
          <div class="start-page__brand">
            <img class="start-page__logo" src="images/logo/VisionForge.png" alt="" width="56" height="56" />
            <h1 class="start-page__title">VisionForge</h1>
          </div>

          <div class="start-page__actions">
            <button type="button" class="start-action-card" id="btn-create-project" data-start-action="create">
              <i class="fa-solid fa-plus start-action-card__icon" aria-hidden="true"></i>
              <span class="start-action-card__label">Create new project</span>
            </button>
            <button type="button" class="start-action-card" id="btn-open-project" data-start-action="open">
              <i class="fa-solid fa-folder-open start-action-card__icon" aria-hidden="true"></i>
              <span class="start-action-card__label">Open existing project</span>
            </button>
          </div>

          <div class="start-recent" aria-label="Recent projects">
            <h2 class="start-recent__heading">Recent projects</h2>
            <p class="start-recent__empty" id="start-recent-empty" hidden>No recent projects</p>
            <ul class="start-recent__list" id="start-recent-list"></ul>
          </div>
        </div>
        <div class="workspace-canvas" id="workspace-canvas" hidden>
          <div class="workspace-stage" id="workspace-stage">
            <img class="workspace-image" id="workspace-image" alt="" draggable="false" hidden />
          </div>
          <footer class="playback-bar" id="playback-bar">
            <div class="playback-bar__controls">
              <button type="button" class="playback-btn" id="playback-skip-start" aria-label="Skip to beginning" title="Skip to beginning">
                <i class="fa-solid fa-backward-step" aria-hidden="true"></i>
              </button>
              <button type="button" class="playback-btn" id="playback-rewind" aria-label="Fast rewind" title="Fast rewind">
                <i class="fa-solid fa-backward-fast" aria-hidden="true"></i>
              </button>
              <button type="button" class="playback-btn" id="playback-step-back" aria-label="Step back" title="Step back">
                <i class="fa-solid fa-caret-left" aria-hidden="true"></i>
              </button>
              <button type="button" class="playback-btn" id="playback-play" aria-label="Play" title="Play" aria-pressed="false">
                <i class="fa-solid fa-play" id="playback-play-icon" aria-hidden="true"></i>
              </button>
              <button type="button" class="playback-btn" id="playback-step-forward" aria-label="Step forward" title="Step forward">
                <i class="fa-solid fa-caret-right" aria-hidden="true"></i>
              </button>
              <button type="button" class="playback-btn" id="playback-forward" aria-label="Fast forward" title="Fast forward">
                <i class="fa-solid fa-forward-fast" aria-hidden="true"></i>
              </button>
              <button type="button" class="playback-btn" id="playback-skip-end" aria-label="Skip to end" title="Skip to end">
                <i class="fa-solid fa-forward-step" aria-hidden="true"></i>
              </button>
            </div>
            <input type="range" class="playback-slider" id="playback-slider" min="0" max="0" value="0" step="1" aria-label="Seek" />
            <label class="playback-frame" for="playback-frame">
              <span class="playback-frame__label">Frame:</span>
              <input type="number" class="playback-frame__input" id="playback-frame" min="0" max="0" value="0" step="1" />
            </label>
          </footer>
        </div>
      </section>

      <div class="inspector-resize-handle" id="inspector-resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize inspector" tabindex="0"></div>

      <aside class="inspector-panel" id="inspector-panel" aria-label="Inspector">
        <div class="inspector-tabs" role="tablist" aria-label="Inspector tabs">
          <button type="button" class="inspector-tab is-selected" id="tab-assets" role="tab" aria-selected="true" aria-controls="panel-assets" data-tab="assets">Assets</button>
          <button type="button" class="inspector-tab" id="tab-labels" role="tab" aria-selected="false" aria-controls="panel-labels" data-tab="labels">Labels</button>
          <button type="button" class="inspector-tab" id="tab-detections" role="tab" aria-selected="false" aria-controls="panel-detections" data-tab="detections">Detections</button>
        </div>
        <div class="inspector-body">
          <div class="inspector-pane" id="panel-assets" role="tabpanel" aria-labelledby="tab-assets">
            <p class="assets-empty" id="assets-empty">No images selected</p>
            <ul class="assets-list" id="assets-list" hidden></ul>
          </div>
          <div class="inspector-pane" id="panel-labels" role="tabpanel" aria-labelledby="tab-labels" hidden></div>
          <div class="inspector-pane" id="panel-detections" role="tabpanel" aria-labelledby="tab-detections" hidden></div>
        </div>
      </aside>
    </div>
  </main>

  <div id="release-overlay" class="settings-overlay release-overlay" hidden aria-modal="true" role="dialog" aria-label="New release">
    <div class="settings-modal release-modal">
      <div class="settings-modal-header">
        <h2 class="settings-modal-title" id="release-title">New Release</h2>
        <button type="button" id="btn-release-close" class="icon-btn" aria-label="Close release dialog">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="settings-modal-body release-modal-body">
        <div id="release-notes" class="release-notes" aria-label="Release notes"></div>
      </div>
      <div class="settings-modal-footer release-modal-footer">
        <div id="release-download-progress" class="release-download-progress" hidden>
          <div class="release-progress-track" aria-hidden="true">
            <div id="release-progress-bar" class="release-progress-bar"></div>
          </div>
          <span id="release-download-percent" class="release-download-percent">0%</span>
        </div>
        <button type="button" id="btn-release-download" class="btn-primary">Download Now</button>
      </div>
    </div>
  </div>

  <div id="create-project-overlay" class="settings-overlay" hidden aria-modal="true" role="dialog" aria-labelledby="create-project-title">
    <div class="settings-modal create-project-modal">
      <div class="settings-modal-header">
        <h2 class="settings-modal-title" id="create-project-title">Configure your new project</h2>
        <button type="button" id="btn-create-project-close" class="icon-btn" aria-label="Close create project dialog">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="settings-modal-body create-project-body">
        <label class="create-project-field">
          <span class="create-project-label">Project name</span>
          <input type="text" id="create-project-name" class="create-project-input" value="Untitled" autocomplete="off" />
        </label>
        <div class="create-project-field">
          <span class="create-project-label">Location</span>
          <div class="create-project-location-row">
            <input type="text" id="create-project-location" class="create-project-input" readonly aria-label="Location" />
            <button type="button" id="btn-create-project-browse" class="create-project-browse" aria-label="Choose folder">...</button>
          </div>
        </div>
        <p class="create-project-hint" id="create-project-hint">Project will be created in ""</p>
        <p class="create-project-error" id="create-project-error" hidden></p>
      </div>
      <div class="settings-modal-footer create-project-footer">
        <button type="button" id="btn-create-project-cancel" class="btn-secondary">Cancel</button>
        <button type="button" id="btn-create-project-next" class="btn-primary">Next</button>
      </div>
    </div>
  </div>

  <script src="scripts/renderer-logger.js"></script>
  <script src="scripts/workspace-panels.js"></script>
  <script src="scripts/workspace-canvas.js"></script>
  <script src="scripts/start-page.js"></script>
  <script src="scripts/create-project-dialog.js"></script>
  <script src="scripts/release-update-panel.js"></script>
  <script src="scripts/window-controls.js"></script>
  <script>
    window.initReleaseUpdate?.();
  </script>
</body>

</html>
