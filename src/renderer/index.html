<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionForge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles/app.css" />
</head>

<body>
  <main class="screen">
    <header class="app-chrome-header" id="app-chrome-header">
      <div class="app-chrome-header__brand sidebar-brand">
        <div class="logo-wrap" aria-hidden="true">
          <img class="brand-logo" src="images/logo/VisionForge.png" alt="" width="28" height="28" />
        </div>
        <span class="sidebar-brand__title">VisionForge</span>
      </div>
      <div class="app-chrome-header__topbar app-topbar" id="app-topbar">
        <div class="app-topbar__left">
          <span class="app-breadcrumb__current">Welcome</span>
        </div>
        <div class="app-topbar__right">
          <button type="button" id="btn-new-release" class="btn-new-release" hidden aria-label="New Release Available" title="New Release Available">
            New Release Available
          </button>
          <div class="window-controls">
            <button type="button" class="window-control-btn" id="window-minimize-btn" aria-label="Minimize">
              <i class="fa-regular fa-window-minimize"></i>
            </button>
            <button type="button" class="window-control-btn" id="window-maximize-btn" aria-label="Maximize">
              <i class="fa-regular fa-window-maximize"></i>
            </button>
            <button type="button" class="window-control-btn window-control-btn--close" id="window-close-btn" aria-label="Close">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="screen-body" id="screen-body">
      <aside class="tools-rail" id="tools-rail" aria-label="Tools">
        <button type="button" class="tool-btn is-selected" id="tool-cursor" data-tool="cursor" aria-label="Mouse Cursor" title="Mouse Cursor" aria-pressed="true">
          <i class="fa-solid fa-arrow-pointer" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" id="tool-rotate" data-tool="rotate" aria-label="Rotate" title="Rotate" aria-pressed="false">
          <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" id="tool-box" data-tool="box" aria-label="Box" title="Box" aria-pressed="false">
          <i class="fa-solid fa-vector-square" aria-hidden="true"></i>
        </button>
        <button type="button" class="tool-btn" id="tool-hexagon" data-tool="hexagon" aria-label="Hexagon" title="Hexagon" aria-pressed="false">
          <svg class="tool-btn__hexagon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <polygon points="12,2 21,7.5 21,16.5 12,22 3,16.5 3,7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
        </button>
      </aside>

      <section class="screen-section screen-section--main">
        <div class="start-page" id="start-page">
          <div class="start-page__brand">
            <img class="start-page__logo" src="images/logo/VisionForge.png" alt="" width="56" height="56" />
            <h1 class="start-page__title">VisionForge</h1>
          </div>

          <div class="start-page__actions">
            <button type="button" class="start-action-card" id="btn-create-project" data-start-action="create">
              <i class="fa-solid fa-plus start-action-card__icon" aria-hidden="true"></i>
              <span class="start-action-card__label">Create new project</span>
            </button>
            <button type="button" class="start-action-card" id="btn-open-project" data-start-action="open">
              <i class="fa-solid fa-folder-open start-action-card__icon" aria-hidden="true"></i>
              <span class="start-action-card__label">Open existing project</span>
            </button>
          </div>

          <div class="start-recent" aria-label="Recent projects">
            <h2 class="start-recent__heading">Recent projects</h2>
            <ul class="start-recent__list">
              <li>
                <button type="button" class="start-recent__row" data-start-action="recent" data-project-name="Sample Labels">
                  <span class="start-recent__name">Sample Labels</span>
                  <span class="start-recent__path">D:\Projects\VisionForge\sample-labels</span>
                </button>
              </li>
              <li>
                <button type="button" class="start-recent__row" data-start-action="recent" data-project-name="Demo Detections">
                  <span class="start-recent__name">Demo Detections</span>
                  <span class="start-recent__path">D:\Projects\VisionForge\demo-detections</span>
                </button>
              </li>
              <li>
                <button type="button" class="start-recent__row" data-start-action="recent" data-project-name="Empty Workspace">
                  <span class="start-recent__name">Empty Workspace</span>
                  <span class="start-recent__path">C:\Users\User\Documents\VisionForge\empty</span>
                </button>
              </li>
            </ul>
          </div>
        </div>
        <div class="workspace-canvas" id="workspace-canvas" hidden></div>
      </section>

      <div class="inspector-resize-handle" id="inspector-resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize inspector" tabindex="0"></div>

      <aside class="inspector-panel" id="inspector-panel" aria-label="Inspector">
        <div class="inspector-tabs" role="tablist" aria-label="Inspector tabs">
          <button type="button" class="inspector-tab is-selected" id="tab-labels" role="tab" aria-selected="true" aria-controls="panel-labels" data-tab="labels">Labels</button>
          <button type="button" class="inspector-tab" id="tab-detections" role="tab" aria-selected="false" aria-controls="panel-detections" data-tab="detections">Detections</button>
        </div>
        <div class="inspector-body">
          <div class="inspector-pane" id="panel-labels" role="tabpanel" aria-labelledby="tab-labels"></div>
          <div class="inspector-pane" id="panel-detections" role="tabpanel" aria-labelledby="tab-detections" hidden></div>
        </div>
      </aside>
    </div>
  </main>

  <div id="release-overlay" class="settings-overlay release-overlay" hidden aria-modal="true" role="dialog" aria-label="New release">
    <div class="settings-modal release-modal">
      <div class="settings-modal-header">
        <h2 class="settings-modal-title" id="release-title">New Release</h2>
        <button type="button" id="btn-release-close" class="icon-btn" aria-label="Close release dialog">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="settings-modal-body release-modal-body">
        <div id="release-notes" class="release-notes" aria-label="Release notes"></div>
      </div>
      <div class="settings-modal-footer release-modal-footer">
        <div id="release-download-progress" class="release-download-progress" hidden>
          <div class="release-progress-track" aria-hidden="true">
            <div id="release-progress-bar" class="release-progress-bar"></div>
          </div>
          <span id="release-download-percent" class="release-download-percent">0%</span>
        </div>
        <button type="button" id="btn-release-download" class="btn-primary">Download Now</button>
      </div>
    </div>
  </div>

  <script src="scripts/renderer-logger.js"></script>
  <script src="scripts/workspace-panels.js"></script>
  <script src="scripts/start-page.js"></script>
  <script src="scripts/release-update-panel.js"></script>
  <script src="scripts/window-controls.js"></script>
  <script>
    window.initReleaseUpdate?.();
  </script>
</body>

</html>
